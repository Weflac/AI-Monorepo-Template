services:
  backend:
    build:
      context: ../../
      dockerfile: build/docker/Dockerfile.backend
    environment:
      - APP_ENV=prod
      - APP_DEBUG=false
      - CORS_ORIGINS=http://localhost:8080
    ports:
      - '8000:8000'
    healthcheck:
      test:
        ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ../../
      dockerfile: build/docker/Dockerfile.frontend
    ports:
      - '8080:80'
    depends_on:
      backend:
        condition: service_healthy
